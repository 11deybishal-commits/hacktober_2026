prompts:
  gstin:
    prompt: "Extract the 15-character Indian GSTIN from this image crop. Return ONLY the uppercase 15 alphanumeric characters. If illegible, reply ILLEGIBLE."
    regex: "^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$"
  
  numeric_digits:
    prompt: "Extract the numerical value from this cell crop. Return only digits and decimal point. Do not include currency symbols or commas."
    regex: "^[0-9]+(\\.[0-9]+)?$"
    
  date:
    prompt: "Extract the invoice date from this image crop. Format as YYYY-MM-DD or DD/MM/YYYY."
    
  amount_in_words:
    prompt: "Transcribe the amount written in words exactly as seen in this image crop."
