# GST Tax Rate Slabs
# Versioned configuration keyed by date
# GST slabs in India: standard rates are 0%, 5%, 12%, 18%, 28%
# Special rates: 0.1% (export supplies), 0.25% (rough diamonds/precious stones), 1.5% (affordable housing), 3% (gold/silver/jewellery)

default_slabs:
  - 0.0
  - 0.1
  - 0.25
  - 1.5
  - 3.0
  - 5.0
  - 12.0
  - 18.0
  - 28.0

# Split rates (intra-state CGST = SGST = slab / 2)
split_slabs:
  - 0.0
  - 0.05
  - 0.125
  - 0.75
  - 1.5
  - 2.5
  - 6.0
  - 9.0
  - 14.0

# Date-aware overrides (e.g. 2025 GST revisions)
historical_slabs:
  pre_2025:
    valid_until: "2024-12-31"
    slabs: [0.0, 0.1, 0.25, 1.5, 3.0, 5.0, 12.0, 18.0, 28.0]
  post_2025:
    valid_from: "2025-01-01"
    slabs: [0.0, 0.1, 0.25, 1.5, 3.0, 5.0, 12.0, 18.0, 28.0]
