profile_name: "standard_indian_billbook"
description: "Standard pre-printed Indian GST Bill-Book with handwritten entries"
zones:
  header:
    normalized_box: [0.0, 0.0, 1.0, 0.18]
    expected_fields: ["supplier.name", "supplier.gstin", "supplier.address"]
  metadata:
    normalized_box: [0.0, 0.18, 1.0, 0.32]
    expected_fields: ["invoice_number", "invoice_date", "buyer.name", "buyer.gstin", "place_of_supply"]
  table:
    normalized_box: [0.0, 0.32, 1.0, 0.78]
    columns:
      - { name: "sr_no", x_range: [0.02, 0.08] }
      - { name: "description", x_range: [0.08, 0.38] }
      - { name: "hsn_sac", x_range: [0.38, 0.48] }
      - { name: "qty", x_range: [0.48, 0.56] }
      - { name: "rate", x_range: [0.56, 0.66] }
      - { name: "taxable_value", x_range: [0.66, 0.78] }
      - { name: "cgst_sgst", x_range: [0.78, 0.88] }
      - { name: "total", x_range: [0.88, 0.98] }
  totals:
    normalized_box: [0.0, 0.78, 1.0, 0.94]
    expected_fields: ["totals.taxable_amount", "totals.cgst_amount", "totals.sgst_amount", "totals.igst_amount", "totals.grand_total", "totals.amount_in_words"]
